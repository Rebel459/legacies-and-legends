plugins {
	id 'fabric-loom' version '1.14.5'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://api.modrinth.com/maven" }
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://maven.shedaniel.me/" }
	maven { url = "https://maven.terraformersmc.com/releases/" }
	maven { url = "https://jitpack.io" }
	maven { url = "https://maven.ladysnake.org/releases" }
	maven { url = "https://maven.resourcefulbees.com/repository/maven-public/" }
    maven { url = "https://maven.isxander.dev/releases" }
    flatDir {
        dirs 'lib'
    }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	include modApi("maven.modrinth:frozenlib:${project.frozenlib_version}")
    include modApi("maven.modrinth:trim-patcher:${project.patcher_version}")
	include modImplementation("maven.modrinth:item-tooltips:${project.tooltips_version}")
	include modApi("maven.modrinth:trinkets-continued:${project.trinkets_version}")
	include modApi ("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
	include modApi ("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

    modImplementation("maven.modrinth:modmenu:$modmenu_version")
    modCompileOnly("maven.modrinth:combat-reborn:$combat_version")
	modCompileOnly("maven.modrinth:rei:$rei_version")
    modCompileOnly("maven.modrinth:architectury-api:$architectury_version")
    modCompileOnly("maven.modrinth:friends-and-foes:$friendsandfoes_version")
    modCompileOnly("com.teamresourceful.resourcefullib:resourcefullib-fabric-1.21.11:$resourceful_version")
    modCompileOnly("dev.isxander:yet-another-config-lib:$yacl_version")
    modCompileOnly("net.fabricmc:fabric-language-kotlin:$kotlin_version")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

loom {
	accessWidenerPath = file("src/main/resources/legacies_and_legends.accesswidener")
}

fabricApi {
    configureDataGeneration() {
        client = true;
        modId = "legacies_and_legends"
    }
}